<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>保存段落</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      padding: 16px;
    }
    .dialog {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    #quote {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      background: #f9f9f9;
      resize: none;
      max-height: 150px;
      overflow-y: auto;
    }
    #thoughts {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }
    .btn-cancel:hover {
      background: #e0e0e0;
    }
    .btn-save {
      background: #4285f4;
      color: white;
    }
    .btn-save:hover {
      background: #1f6fe0;
    }
    .btn-save:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="dialog">
    <h2>保存段落</h2>

    <div class="section">
      <label for="quote">选中的文本</label>
      <textarea id="quote" readonly></textarea>
    </div>

    <div class="section">
      <label for="thoughts">你的想法</label>
      <textarea id="thoughts" placeholder="写下读到这段话时的想法…"></textarea>
    </div>

    <div class="buttons">
      <button class="btn-cancel" id="cancel">取消</button>
      <button class="btn-save" id="save">保存</button>
    </div>
  </div>

  <script src="quote-dialog.js"></script>
</body>
</html>
